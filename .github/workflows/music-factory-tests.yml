name: music-factory tests

on:
  push:
    paths:
      - "music-factory/**"
      - ".github/workflows/music-factory-tests.yml"
  pull_request:
    paths:
      - "music-factory/**"
      - ".github/workflows/music-factory-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
